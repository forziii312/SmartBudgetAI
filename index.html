<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Budget AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем Chart.js для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2, h3 {
            text-align: center;
            margin: 0;
        }

        .section {
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            opacity: 0.8;
            font-weight: 500;
        }

        input, select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
        }

        .btn-add {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .btn-stats {
            background-color: var(--tg-theme-link-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        #chart-container {
            height: 250px;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Секция добавления расхода -->
    <div class="section">
        <h2> Новый расход</h2>
        <div class="input-group">
            <label for="amount">Сумма (тенге)</label>
            <input type="number" id="amount" placeholder="Например: 1500">
        </div>
        <div class="input-group">
            <label for="category">Категория</label>
            <select id="category">
                <option value="food">🍔 Еда</option>
                <option value="taxi">🚕 Такси</option>
                <option value="study">📚 Учеба</option>
                <option value="fun">🎉 Развлечения</option>
                <option value="other">📦 Другое</option>
            </select>
        </div>
        <button class="btn-add" onclick="sendData()">Добавить расход</button>
    </div>

    <!-- Секция статистики (изначально скрыта) -->
    <div id="stats-section" class="section hidden">
        <h3>📊 Статистика за неделю</h3>
        <div id="chart-container">
            <canvas id="expenseChart"></canvas>
        </div>
        <div id="ai-advice" style="margin-top: 15px; font-style: italic; opacity: 0.9;"></div>
        <button class="btn-stats" onclick="hideStats()">Закрыть</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Функция отправки данных боту
        function sendData() {
            let amount = document.getElementById('amount').value;
            let category = document.getElementById('category').value;

            if (!amount) {
                tg.showAlert("Введите сумму!");
                return;
            }

            let data = {
                action: "add_expense",
                amount: amount,
                category: category
            };

            tg.sendData(JSON.stringify(data)); 
            
            // Очищаем поля
            document.getElementById('amount').value = '';
        }

        // Функция для отображения статистики (вызывается ботом через WebApp.openLink или другим способом)
        // Пока что мы будем показывать её по кнопке внутри Mini App
        function showStats(chartData, adviceText) {
            const statsSection = document.getElementById('stats-section');
            const chartCanvas = document.getElementById('expenseChart');
            const adviceDiv = document.getElementById('ai-advice');

            statsSection.classList.remove('hidden');
            adviceDiv.textContent = adviceText;

            // Рисуем график
            if (window.myChart) {
                window.myChart.destroy();
            }

            window.myChart = new Chart(chartCanvas, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(chartData),
                    datasets: [{
                        data: Object.values(chartData),
                        backgroundColor: [
                            '#FF6384', // food
                            '#36A2EB', // taxi
                            '#FFCE56', // study
                            '#4BC0C0', // fun
                            '#9966FF'  // other
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: tg.themeParams.text_color || '#000'
                            }
                        }
                    }
                }
            });
        }

        function hideStats() {
            document.getElementById('stats-section').classList.add('hidden');
        }

        // Слушаем сообщения от бота (для будущего функционала)
        tg.onEvent('mainButtonClicked', function() {
            sendData();
        });
    </script>
</body>
</html>
