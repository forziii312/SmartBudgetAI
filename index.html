<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Budget AI</title>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            opacity: 0.7;
        }

        input, select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
        }

        /* Кнопка будет управляться через Telegram MainButton, но для теста оставим и тут */
        .btn-add {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>💸 Новый расход</h2>

    <div class="input-group">
        <label for="amount">Сумма (тенге)</label>
        <input type="number" id="amount" placeholder="Например: 1500">
    </div>

    <div class="input-group">
        <label for="category">Категория</label>
        <select id="category">
            <option value="food">🍔 Еда</option>
            <option value="taxi">🚕 Такси</option>
            <option value="study">📚 Учеба</option>
            <option value="fun">🎉 Развлечения</option>
            <option value="other">📦 Другое</option>
        </select>
    </div>

    <button class="btn-add" onclick="sendData()">Добавить расход</button>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на весь экран

        // Функция отправки данных боту
        function sendData() {
            let amount = document.getElementById('amount').value;
            let category = document.getElementById('category').value;

            if (!amount) {
                tg.showAlert("Введите сумму!");
                return;
            }

            // Формируем объект данных
            let data = {
                action: "add_expense",
                amount: amount,
                category: category
            };

            // Отправляем данные боту в виде строки JSON
            tg.sendData(JSON.stringify(data)); 
        }
        
        // Настройка главной кнопки Telegram (опционально, можно использовать вместо HTML кнопки)
        /*
        tg.MainButton.setText("Добавить расход");
        tg.MainButton.show();
        tg.MainButton.onClick(function() {
            sendData();
        });
        */
    </script>
</body>
</html>
